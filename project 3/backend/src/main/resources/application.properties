spring.application.name=student-activity
server.port=8081

# DB Configuration (Environment Variables for Prod, H2 for Local)
spring.h2.console.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./studentdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Show SQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Security Logging
logging.level.org.springframework.security=DEBUG
